<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Mock Tileset Test</title>
  <style>
    body { font-family: -apple-system, monospace; padding: 20px; background: #0a0e14; color: #e6e8eb; }
    .ok { background: rgba(109,213,140,0.15); color: #6dd58c; padding: 6px 10px; border-radius: 4px; }
    .err { background: rgba(255,95,95,0.15); color: #ff5f5f; padding: 6px 10px; border-radius: 4px; }
    .info { background: rgba(79,140,255,0.15); color: #4f8cff; padding: 6px 10px; border-radius: 4px; }
    pre { background: #000; padding: 8px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Mock Tileset Test (b3dm 1.0 + glTF 1.0 binary) <span id="ts"></span></h1>
  <p>Tests the glTF 1.0 binary parser using a locally-generated tile.</p>
  <div id="log"></div>
  <pre id="full"></pre>
  <script>document.getElementById('ts').textContent = '[' + new Date().toISOString() + ']';</script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { Tileset } from './js/tiles-loader.js?v=now';
    import { logger } from './js/logger.js?v=now';

    const log = document.getElementById('log');
    const full = document.getElementById('full');
    function line(level, msg) {
      const d = document.createElement('div');
      d.className = 'step ' + level;
      d.textContent = msg;
      log.appendChild(d);
      full.textContent += msg + '\n';
      console[level === 'err' ? 'error' : 'log'](msg);
    }
    function info(m) { line('info', m); }
    function ok(m) { line('ok', m); }
    function err(m) { line('err', m); }

    // Mirror logger to the page
    const attachLog = document.createElement('div');
    attachLog.id = 'logger-mirror';
    attachLog.style.background = '#000';
    attachLog.style.padding = '8px';
    attachLog.style.marginTop = '12px';
    attachLog.style.maxHeight = '240px';
    attachLog.style.overflowY = 'auto';
    document.body.appendChild(attachLog);
    const origInfo = logger.info.bind(logger);
    const origOk = logger.ok.bind(logger);
    const origWarn = logger.warn.bind(logger);
    const origErr = logger.err.bind(logger);
    logger.info = (m) => { line('info', m); attachLog.textContent += `[info] ${m}\n`; origInfo(m); };
    logger.ok = (m) => { line('ok', m); attachLog.textContent += `[ok] ${m}\n`; origOk(m); };
    logger.warn = (m) => { line('info', m); attachLog.textContent += `[warn] ${m}\n`; origWarn(m); };
    logger.err = (m) => { line('err', m); attachLog.textContent += `[err] ${m}\n`; origErr(m); };

    async function run() {
      try {
        info('[1/4] Loading mock tileset...');
        const ts = new Tileset();
        await ts.load('./mock-tileset/tileset.json');
        const sp = ts.root.root.boundingVolume.sphere;
        ok(`tileset loaded, sphere radius ${sp[3]} m`);

        info('[2/4] Loading b3dm tile...');
        const queryBox = new THREE.Box3(
          new THREE.Vector3(sp[0] - sp[3], sp[1] - sp[3], sp[2] - sp[3]),
          new THREE.Vector3(sp[0] + sp[3], sp[1] + sp[3], sp[2] + sp[3])
        );
        const meshes = await ts.getMeshesInBox(queryBox);
        if (meshes.length === 0) throw new Error('No meshes loaded');
        ok(`Loaded ${meshes.length} meshes`);

        info('[3/4] Merging geometry...');
        const merged = ts.buildMergedGeometry(meshes);
        const vcount = merged.attributes.position.count;
        const tcount = merged.index ? merged.index.count / 3 : vcount / 3;
        if (vcount < 1) throw new Error('Empty geometry');
        ok(`Merged: ${vcount} vertices, ${tcount} triangles`);

        info('[4/4] Verifying mesh is visible in scene...');
        // Render a frame to confirm geometry is non-degenerate
        const scene = new THREE.Scene();
        const m = new THREE.Mesh(merged, new THREE.MeshBasicMaterial({ vertexColors: true, color: 0x808080 }));
        m.updateMatrixWorld(true);
        scene.add(m);
        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
        camera.position.set(0, 0, 5);
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        const renderer = new THREE.WebGLRenderer({ canvas: document.createElement('canvas') });
        renderer.render(scene, camera);
        ok('Mock tileset parses and renders successfully');
        ok('✅ glTF 1.0 binary parser test passed');
      } catch (e) {
        err('❌ Test failed: ' + e.message);
        console.error(e);
      }
    }
    run();
  </script>
</body>
</html>
