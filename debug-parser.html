<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Debug b3dm - Detailed</title>
</head>
<body>
  <h1>Debug b3dm - Detailed</h1>
  <pre id="out" style="font-family: monospace; white-space: pre-wrap;"></pre>
  <script>
    const out = document.getElementById('out');
    function log(msg) {
      out.textContent += msg + '\n';
      console.log(msg);
    }

    function parseB3dmHeaderTest(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      const B3DM_MAGIC = 0x6d643362;
      const magic = view.getUint32(0, true);
      if (magic !== B3DM_MAGIC) {
        throw new Error('Not a b3dm file');
      }
      const version = view.getUint32(4, true);
      const byteLength = view.getUint32(8, true);
      const ftJsonLen = view.getUint32(12, true);
      const ftBinLen = view.getUint32(16, true);
      const btJsonLen = view.getUint32(20, true);
      const btBinLen = view.getUint32(24, true);
      const glbOffset = 28 + ftJsonLen + ftBinLen + btJsonLen + btBinLen;
      const header = { version, byteLength, ftJsonLen, ftBinLen, btJsonLen, btBinLen, glbOffset };

      log('ftJsonLen=' + ftJsonLen);
      if (ftJsonLen > 0) {
        const raw = new Uint8Array(arrayBuffer, 28, ftJsonLen);
        log('raw length: ' + raw.length);
        log('raw bytes (hex): ' + Array.from(raw).map(b => b.toString(16).padStart(2, '0')).join(' '));
        let end = ftJsonLen;
        while (end > 0) {
          const b = raw[end - 1];
          if (b === 0x20 || b === 0x09 || b === 0x0a || b === 0x0d || b === 0x00) end--;
          else break;
        }
        log('trimmed end: ' + end);
        const text = new TextDecoder('utf-8').decode(raw.subarray(0, end));
        log('text: ' + JSON.stringify(text));
        try {
          header.featureTable = JSON.parse(text);
          log('ft parse OK');
        } catch (e) {
          log('ft parse error: ' + e.message);
          throw e;
        }
      }
      return header;
    }

    async function run() {
      try {
        log('Fetching tile.b3dm...');
        const r = await fetch('./mock-tileset/tile.b3dm');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const buf = await r.arrayBuffer();
        log('b3dm size: ' + buf.byteLength);
        const header = parseB3dmHeaderTest(buf);
        log('header.glbOffset: ' + header.glbOffset);
        log('All OK!');
      } catch (e) {
        log('Error: ' + e.message);
        log('Stack: ' + e.stack);
      }
    }
    run();
  </script>
</body>
</html>
