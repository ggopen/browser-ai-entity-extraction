<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Inline parser test</title>
</head>
<body>
  <h1>Inline parser test (no imports)</h1>
  <pre id="out" style="font-family: monospace; white-space: pre-wrap;"></pre>
  <script>
    const out = document.getElementById('out');
    function log(msg) {
      out.textContent += msg + '\n';
      console.log(msg);
    }

    async function run() {
      try {
        const r = await fetch('./mock-tileset/tile.b3dm');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const buf = await r.arrayBuffer();
        log('b3dm size: ' + buf.byteLength);

        // Inline the parser
        const B3DM_MAGIC = 0x6d643362;
        const view = new DataView(buf);
        const magic = view.getUint32(0, true);
        log('b3dm magic: 0x' + magic.toString(16) + (magic === B3DM_MAGIC ? ' OK' : ' BAD'));
        const ftJsonLen = view.getUint32(12, true);
        log('ftJsonLen: ' + ftJsonLen);

        // Test trim
        const raw = new Uint8Array(buf, 28, ftJsonLen);
        let end = ftJsonLen;
        while (end > 0) {
          const b = raw[end - 1];
          if (b === 0x20 || b === 0x09 || b === 0x0a || b === 0x0d || b === 0x00) end--;
          else break;
        }
        log('trimmed end: ' + end);
        const text = new TextDecoder('utf-8').decode(raw.subarray(0, end));
        log('text: ' + JSON.stringify(text));
        log('text length: ' + text.length);

        try {
          const j = JSON.parse(text);
          log('parse OK: ' + JSON.stringify(j));
        } catch (e) {
          log('parse error: ' + e.message);
        }
      } catch (e) {
        log('Error: ' + e.message);
        log('Stack: ' + e.stack);
      }
    }
    run();
  </script>
</body>
</html>
